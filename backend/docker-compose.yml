version: '3.8'
services:
  db:
    image: ankane/pgvector:latest
    container_name: spatial_memory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: spatial_memory
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: